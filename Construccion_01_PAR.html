*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0F2040;--blue:#1C3A6E;--teal:#00695C;--teal-soft:#E0F2F1;
  --amber:#C47C1A;--red:#B83232;--purple:#6C3483;
  --cream:#F7F6F2;--warm:#EDECEA;--border:#C9C5BB;
  --text:#1C1C1E;--text2:#3A3A3C;--text3:#6B6B6E;--sky:#A8C4E8;
}
html,body{width:100%;height:100%;overflow:hidden;background:#0a101e;font-family:'DM Sans',system-ui,sans-serif}
body.video{cursor:none}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;
  display:flex;flex-direction:column;background:var(--cream)}

/* header */
.hdr{height:64px;background:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 36px;flex-shrink:0}
.hdr-b{font-size:22px;color:var(--sky);font-weight:500}
.hdr-b b{color:#fff;font-weight:700}
.hdr-r{display:flex;gap:14px;align-items:center}
.pill{font-size:20px;font-weight:800;color:#fff;padding:6px 18px;border-radius:8px;letter-spacing:.06em}
.pill.a{background:var(--amber)} .pill.b{background:var(--blue);border:1.5px solid var(--sky)}

.body{flex:1;min-height:0;display:flex}

/* sidebar */
.side{width:520px;flex-shrink:0;background:var(--warm);border-right:3px solid var(--border);
  padding:24px 32px 18px;display:flex;flex-direction:column;gap:16px}
.stitle{font-family:'DM Serif Display',serif;font-size:46px;line-height:1.02;color:var(--navy)}
.ssub{font-size:24px;color:var(--text2);font-style:italic;margin-top:4px}
.datos{background:#fff;border:2px solid var(--border);border-radius:14px;padding:14px 18px;display:grid;
  grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.dato .k{font-size:18px;font-weight:700;color:var(--text3);letter-spacing:.08em}
.dato .v{font-size:32px;font-weight:800;color:var(--navy);line-height:1.1}
.dato .v small{font-size:20px;font-weight:600;color:var(--text2)}
.steps{display:flex;flex-direction:column;gap:7px;flex:1}
.st{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--border);border-left:7px solid var(--c,var(--teal));
  border-radius:12px;padding:6px 14px;opacity:.38;transition:opacity .35s,transform .35s,box-shadow .35s}
.st .n{width:38px;height:38px;border-radius:50%;background:var(--c,var(--teal));color:#fff;font-weight:800;font-size:20px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.st .t{font-size:22px;font-weight:700;color:var(--navy);line-height:1.15}
.st.done{opacity:.75}
.st.done .n{font-size:0}
.st.done .n::after{content:'✓';font-size:22px}
.st.on{opacity:1;transform:translateX(6px);box-shadow:0 6px 18px rgba(15,32,64,.16)}
.mat{display:flex;gap:10px;flex-wrap:wrap}
.mat span{font-size:18px;font-weight:700;color:var(--teal);background:var(--teal-soft);border:1.5px solid var(--teal);
  border-radius:20px;padding:4px 14px}

/* figure */
.fig{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}
.svgwrap{flex:1;min-height:0;position:relative}
.svgwrap svg{position:absolute;inset:0;width:100%;height:100%}
.cap{height:128px;flex-shrink:0;background:#fff;border-top:3px solid var(--border);display:flex;align-items:center;gap:26px;padding:0 36px}
.cap .num{flex-shrink:0;width:92px;height:92px;border-radius:18px;background:var(--c,var(--teal));color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.cap .num b{font-size:44px;font-weight:800}
.cap .num span{font-size:15px;font-weight:700;letter-spacing:.08em;opacity:.9;margin-top:4px}
.cap .txt{font-size:31px;font-weight:500;color:var(--text);line-height:1.28}
.cap .txt b{color:var(--c,var(--teal));font-weight:800}
body.render *{transition:none!important;animation:none!important}

.prog{height:8px;background:var(--warm);flex-shrink:0}
.prog i{display:block;height:100%;width:0;background:var(--amber)}
.ftr{height:44px;background:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 36px;flex-shrink:0}
.ftr span{font-size:18px;color:var(--sky);font-weight:500}

#help{position:fixed;right:14px;top:74px;background:rgba(15,32,64,.85);color:#fff;font:600 13px 'DM Sans',sans-serif;
  padding:8px 12px;border-radius:8px;z-index:20;opacity:.8}
body.video #help,body.render #help{display:none}
</style>
</head>
<body>
<div id="stage">
  <div class="hdr">
    <div class="hdr-b">Geometría 7° · Período 3 · <b id="hdrTxt"></b></div>
    <div class="hdr-r" id="pills"></div>
  </div>
  <div class="body">
    <aside class="side">
      <div>
        <div class="stitle" id="stitle"></div>
        <div class="ssub" id="ssub"></div>
      </div>
      <div class="datos" id="datos"></div>
      <div class="steps" id="steps"></div>
      <div class="mat" id="mats"></div>
    </aside>
    <section class="fig">
      <div class="svgwrap">
        <svg id="svg" viewBox="0 0 25 15.2" preserveAspectRatio="xMidYMid meet" aria-label="Construcción animada">
          <defs>
            <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0.08" dy="0.12" stdDeviation="0.09" flood-color="#0F2040" flood-opacity=".28"/>
            </filter>
            <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#9C7A2E"/><stop offset=".35" stop-color="#E9D49A"/>
              <stop offset=".6" stop-color="#CDAE62"/><stop offset="1" stop-color="#8A6A22"/>
            </linearGradient>
            <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#7d8189"/><stop offset=".5" stop-color="#e7e9ec"/><stop offset="1" stop-color="#6d7178"/>
            </linearGradient>
            <radialGradient id="head" cx=".35" cy=".35" r=".8">
              <stop offset="0" stop-color="#A8664A"/><stop offset="1" stop-color="#5A2E1E"/>
            </radialGradient>
            <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#E8C79A"/><stop offset="1" stop-color="#C79A62"/>
            </linearGradient>
            <linearGradient id="pbody" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#3a3a3c"/><stop offset=".45" stop-color="#1C1C1E"/><stop offset="1" stop-color="#000"/>
            </linearGradient>
            <linearGradient id="ybody" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#FFD35A"/><stop offset=".5" stop-color="#F2B01E"/><stop offset="1" stop-color="#C98A0A"/>
            </linearGradient>
            <radialGradient id="paper" cx=".5" cy=".45" r=".75">
              <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F4F1EA"/>
            </radialGradient>
          </defs>

          <!-- cartulina -->
          <rect x="0.5" y="0.4" width="24" height="14.4" rx="0.15" fill="url(#paper)" stroke="#DEDBD3" stroke-width="0.04"/>
          <text x="0.9" y="1.15" font-size="0.42" fill="#B0ACA2" font-family="DM Sans" font-weight="600" letter-spacing="0.02">Nombre: ______________________ · Grupo: 7.__</text>

          <g id="constr"></g>
          <g id="sides"></g>
          <g id="labels"></g>
          <g id="inst"></g>
        </svg>
      </div>
      <div class="cap" id="cap"><div class="num" id="capnum"><b>1</b><span>PASO</span></div><div class="txt" id="captxt"></div></div>
      <div class="prog"><i id="prog"></i></div>
    </section>
  </div>
  <div class="ftr"><span id="ftrL"></span><span>I.E. Merceditas Gómez Martínez · Medellín</span></div>
</div>
<div id="help">Clic / → : siguiente paso · ← : anterior · A : reproducción automática · F : pantalla completa</div>

<script>
/* =====================================================================
   MOTOR DE CONSTRUCCIONES — Geometría 7° (unidades: cm, y hacia abajo)
   Cada construcción define: CFG, STEPS, blankExtra(), apply(S)
   ===================================================================== */
const deg=Math.PI/180, R2D=180/Math.PI;
const cl=x=>Math.max(0,Math.min(1,x));
const ez=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const seg=(p,a,b)=>ez(cl((p-a)/(b-a)));
const lerp=(a,b,t)=>a+(b-a)*t;
const L2=(P,Q,t)=>[lerp(P[0],Q[0],t),lerp(P[1],Q[1],t)];
const pol=(P,r,th)=>[P[0]+r*Math.cos(th*deg),P[1]+r*Math.sin(th*deg)];
const angOf=(P,Q)=>Math.atan2(Q[1]-P[1],Q[0]-P[0])*R2D;
const dist=(P,Q)=>Math.hypot(Q[0]-P[0],Q[1]-P[1]);
const f=n=>(+n).toFixed(3);
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
const svg=document.getElementById('svg');
const G={constr:svg.querySelector('#constr'),sides:svg.querySelector('#sides'),labels:svg.querySelector('#labels'),inst:svg.querySelector('#inst')};
const FONT='DM Sans';

/* ---------------- helpers de dibujo ---------------- */
function arcPath(P,r,a0,a1){ if(Math.abs(a1-a0)<.05) return '';
  const p0=pol(P,r,a0),p1=pol(P,r,a1),large=Math.abs(a1-a0)>180?1:0,sw=a1>a0?1:0;
  return `M${f(p0[0])},${f(p0[1])} A${r},${r} 0 ${large} ${sw} ${f(p1[0])},${f(p1[1])}`;}
function setLine(ln,P,Q,t,op){const E=L2(P,Q,t);ln.setAttribute('x1',f(P[0]));ln.setAttribute('y1',f(P[1]));ln.setAttribute('x2',f(E[0]));ln.setAttribute('y2',f(E[1]));ln.setAttribute('opacity',t>0?(op??1):0);}
function sideLine(){return el('line',{stroke:'#1C1C1E','stroke-width':'.075','stroke-linecap':'round',opacity:0},G.sides);}
function constrLine(){return el('line',{stroke:'#5E6B7A','stroke-width':'.05','stroke-linecap':'round',opacity:0},G.constr);}
function constrArc(){return el('path',{fill:'none',stroke:'#5E6B7A','stroke-width':'.055','stroke-linecap':'round'},G.constr);}
function point(P,name,dx,dy,color){
  const g=el('g',{opacity:0},G.labels);
  const halo=el('circle',{cx:P[0],cy:P[1],r:.34,fill:color,opacity:.18},g);
  el('circle',{cx:P[0],cy:P[1],r:.13,fill:color},g);
  if(name){const t=el('text',{x:P[0]+dx,y:P[1]+dy,'font-size':'.78','font-weight':'800',fill:'#1C1C1E','font-family':FONT,'text-anchor':'middle'},g);t.textContent=name;}
  return {g,halo,set(op,pulse=0){g.setAttribute('opacity',f(op));halo.setAttribute('r',f(.34+.35*Math.abs(pulse)));}};
}
function meas(P,Q,txt,off,color='#1A6B5A'){
  const m=L2(P,Q,.5); const d=[Q[0]-P[0],Q[1]-P[1]]; const l=Math.hypot(...d);
  const n=[d[1]/l,-d[0]/l]; const pos=[m[0]+n[0]*off,m[1]+n[1]*off];
  let ang=Math.atan2(d[1],d[0])*R2D; if(ang>90)ang-=180; if(ang<-90)ang+=180;
  const g=el('g',{opacity:0,transform:`rotate(${f(ang)} ${f(pos[0])} ${f(pos[1])})`},G.labels);
  const w=txt.length*.31+.5;
  el('rect',{x:pos[0]-w/2,y:pos[1]-.42,width:w,height:.76,rx:.16,fill:'#fff',stroke:color,'stroke-width':'.04'},g);
  const t=el('text',{x:pos[0],y:pos[1]+.17,'font-size':'.5','font-weight':'800',fill:color,'font-family':FONT,'text-anchor':'middle'},g);
  t.textContent=txt; return g;
}
/* marca de ángulo en V entre las direcciones a0→a1 (grados de pantalla, a1>a0) */
function angleMark(V,a0,a1,r,color,txt,labR){
  const g=el('g',{opacity:0},G.labels);
  const p1=pol(V,r,a0),p2=pol(V,r,a1);
  el('path',{d:`M${f(V[0])},${f(V[1])} L${f(p1[0])},${f(p1[1])} A${r},${r} 0 0 1 ${f(p2[0])},${f(p2[1])} Z`,fill:color,'fill-opacity':.14,stroke:color,'stroke-width':'.05'},g);
  const pm=pol(V,labR,(a0+a1)/2);
  el('text',{x:f(pm[0]),y:f(pm[1]+.18),'font-size':'.5','font-weight':'800',fill:color,'font-family':FONT,'text-anchor':'middle'},g).textContent=txt;
  return g;
}
function seal(title,sub,color,x0=15.6){
  const g=el('g',{opacity:0,transform:`translate(${x0-15.6} 0)`},G.labels);
  el('rect',{x:15.6,y:1.35,width:8.4,height:2.35,rx:.3,fill:'#fff',stroke:color,'stroke-width':'.06',filter:'url(#sh)'},g);
  el('text',{x:19.8,y:2.3,'font-size':'.62','font-weight':'800',fill:color,'font-family':FONT,'text-anchor':'middle'},g).textContent=title;
  el('text',{x:19.8,y:3.15,'font-size':'.46','font-weight':'500',fill:'#3A3A3C','font-family':FONT,'text-anchor':'middle','font-style':'italic'},g).textContent=sub;
  return g;
}
const op=(e,v)=>e.setAttribute('opacity',f(v));

/* ---------------- REGLA (20 cm) ---------------- */
const ruler=el('g',{filter:'url(#sh)'},G.inst);
(function(){
  const len=21,h=2.4,o=.5;
  el('rect',{x:-o,y:0,width:len,height:h,rx:.12,fill:'rgba(247,168,35,.55)',stroke:'rgba(176,110,10,.9)','stroke-width':'.035'},ruler);
  el('rect',{x:-o,y:0,width:len,height:.08,fill:'rgba(255,255,255,.55)'},ruler);
  for(let mm=0;mm<=200;mm++){const x=mm/10,L=mm%10===0?.55:(mm%5===0?.38:.22);
    el('line',{x1:x,y1:0,x2:x,y2:L,stroke:'#4a2a05','stroke-width':mm%10===0?'.03':'.018'},ruler);
    if(mm%10===0) el('text',{x:x,y:1.05,'font-size':'.42','font-weight':'700',fill:'#4a2a05','font-family':FONT,'text-anchor':'middle'},ruler).textContent=mm/10;}
  el('text',{x:10,y:1.9,'font-size':'.34','font-weight':'600',fill:'rgba(74,42,5,.55)','font-family':FONT,'text-anchor':'middle'},ruler).textContent='cm';
})();
const rulerHi=el('circle',{cx:10,cy:.15,r:.42,fill:'none',stroke:'#B83232','stroke-width':'.07',opacity:0},ruler);
const rulerTexts=[...ruler.querySelectorAll('text')];

/* ---------------- TRANSPORTADOR (radio 4,6 cm) ---------------- */
const PR=4.6;
const prot=el('g',{filter:'url(#sh)',opacity:0},G.inst);
const protSweep=el('path',{fill:'rgba(184,50,50,.22)',stroke:'none'},prot);
(function(){
  const R=PR, ri=2.55, yb=-.5;
  el('path',{d:`M${-R},0 A${R},${R} 0 0 1 ${R},0 L${R},.95 L${-R},.95 Z M${-ri},${yb} A${ri},${ri} 0 0 1 ${ri},${yb} Z`,
    'fill-rule':'evenodd',fill:'rgba(255,190,30,.55)',stroke:'rgba(170,110,0,.95)','stroke-width':'.035'},prot);
  el('line',{x1:-R,y1:0,x2:R,y2:0,stroke:'#4a2a05','stroke-width':'.025'},prot);
  for(let d=0;d<=180;d++){const L=d%10===0?.42:(d%5===0?.3:.17), a=-d;
    const p0=pol([0,0],R,a),p1=pol([0,0],R-L,a);
    el('line',{x1:f(p0[0]),y1:f(p0[1]),x2:f(p1[0]),y2:f(p1[1]),stroke:'#4a2a05','stroke-width':d%10===0?'.025':'.014'},prot);
    if(d%10===0){
      const po=pol([0,0],R-.72,a), pi=pol([0,0],R-1.2,a), rot=90-d;
      el('text',{x:f(po[0]),y:f(po[1]),'font-size':'.3','font-weight':'800',fill:'#3b2204','font-family':FONT,'text-anchor':'middle','dominant-baseline':'middle',transform:`rotate(${rot} ${f(po[0])} ${f(po[1])})`},prot).textContent=d;
      el('text',{x:f(pi[0]),y:f(pi[1]),'font-size':'.24','font-weight':'600',fill:'#6b4a12','font-family':FONT,'text-anchor':'middle','dominant-baseline':'middle',transform:`rotate(${rot} ${f(pi[0])} ${f(pi[1])})`},prot).textContent=180-d;
    }}
  for(let k=-9;k<=9;k++){const x=k/2;el('line',{x1:x,y1:.95,x2:x,y2:k%2===0?.62:.75,stroke:'#4a2a05','stroke-width':'.018'},prot);}
  el('line',{x1:0,y1:-.45,x2:0,y2:.45,stroke:'#B83232','stroke-width':'.03'},prot);
})();
const protCenter=el('circle',{cx:0,cy:0,r:.3,fill:'none',stroke:'#B83232','stroke-width':'.07',opacity:0},prot);
const protBase=el('line',{x1:-PR,y1:0,x2:PR,y2:0,stroke:'#B83232','stroke-width':'.08',opacity:0},prot);
const protTick=el('line',{stroke:'#B83232','stroke-width':'.07','stroke-linecap':'round',opacity:0},prot);
const protNum=el('circle',{r:.3,fill:'none',stroke:'#B83232','stroke-width':'.06',opacity:0},prot);

/* ---------------- COMPÁS ---------------- */
const comp=el('g',{filter:'url(#sh)'},G.inst);
const legN=el('polygon',{fill:'url(#gold)',stroke:'#6b5018','stroke-width':'.02'},comp);
const needle=el('polygon',{fill:'url(#steel)',stroke:'#4b4f55','stroke-width':'.012'},comp);
const legP=el('polygon',{fill:'url(#gold)',stroke:'#6b5018','stroke-width':'.02'},comp);
const clampC=el('polygon',{fill:'#6A3524',stroke:'#3d1c10','stroke-width':'.02'},comp);
const pen=el('polygon',{fill:'url(#pbody)'},comp);
const penWood=el('polygon',{fill:'url(#wood)'},comp);
const penLead=el('polygon',{fill:'#2b2b2b'},comp);
const bar=el('line',{stroke:'#9aa0a8','stroke-width':'.07','stroke-linecap':'round'},comp);
const handle=el('polygon',{fill:'url(#head)'},comp);
const hinge=el('circle',{r:.42,fill:'url(#head)',stroke:'#3d1c10','stroke-width':'.03'},comp);
const hingeS=el('circle',{r:.1,fill:'#d9d2c4'},comp);
function taper(P,Q,w0,w1){const d=[Q[0]-P[0],Q[1]-P[1]],l=Math.hypot(...d)||1,n=[-d[1]/l,d[0]/l];
  return [[P[0]+n[0]*w0/2,P[1]+n[1]*w0/2],[Q[0]+n[0]*w1/2,Q[1]+n[1]*w1/2],[Q[0]-n[0]*w1/2,Q[1]-n[1]*w1/2],[P[0]-n[0]*w0/2,P[1]-n[1]*w0/2]].map(p=>f(p[0])+','+f(p[1])).join(' ');}
function along(P,Q,d){const v=[Q[0]-P[0],Q[1]-P[1]],l=Math.hypot(...v);return [P[0]+v[0]/l*d,P[1]+v[1]/l*d];}
function drawCompass(P,r,th,side){
  const LEG=8.2,Q=pol(P,r,th),M=L2(P,Q,.5),h=Math.sqrt(Math.max(.01,LEG*LEG-(r/2)**2));
  const n=[-Math.sin(th*deg)*side,Math.cos(th*deg)*side], H=[M[0]+n[0]*h,M[1]+n[1]*h];
  const lN=dist(H,P); legN.setAttribute('points',taper(H,along(H,P,lN-1.0),.46,.26));
  needle.setAttribute('points',taper(along(H,P,lN-1.1),P,.1,.01));
  const lP=dist(H,Q), k1=along(H,Q,lP-2.3), k2=along(H,Q,lP-1.75);
  legP.setAttribute('points',taper(H,k2,.46,.28)); clampC.setAttribute('points',taper(k1,k2,.62,.62));
  const pb0=along(H,Q,lP-2.6),pb1=along(H,Q,lP-.55),pw=along(H,Q,lP-.2);
  pen.setAttribute('points',taper(pb0,pb1,.3,.3)); penWood.setAttribute('points',taper(pb1,pw,.3,.1)); penLead.setAttribute('points',taper(pw,Q,.1,.02));
  const b1=along(H,P,2.6),b2=along(H,Q,2.6);
  bar.setAttribute('x1',f(b1[0]));bar.setAttribute('y1',f(b1[1]));bar.setAttribute('x2',f(b2[0]));bar.setAttribute('y2',f(b2[1]));
  handle.setAttribute('points',taper(H,[H[0]+n[0]*1.25,H[1]+n[1]*1.25],.34,.26));
  hinge.setAttribute('cx',f(H[0]));hinge.setAttribute('cy',f(H[1]));hingeS.setAttribute('cx',f(H[0]));hingeS.setAttribute('cy',f(H[1]));
}
/* guía de radio (línea punteada + rótulo) */
const radGuide=el('line',{stroke:'#C47C1A','stroke-width':'.045','stroke-dasharray':'.18 .14',opacity:0},G.constr);
const radLbl=el('text',{'font-size':'.5','font-weight':'800',fill:'#C47C1A','font-family':FONT,opacity:0,'text-anchor':'middle'},G.constr);


/* ---------------- ESCUADRA 45° (catetos de 10,5 cm) ---------------- */
const EL=10.5;
const esc=el('g',{filter:'url(#sh)',opacity:0},G.inst);
(function(){
  const i1=1.0, i2=EL-3.0;
  el('path',{d:`M0,0 L${EL},0 L0,${-EL} Z M${i1},${-i1} L${i1},${-i2} L${i2},${-i1} Z`,'fill-rule':'evenodd',
    fill:'rgba(70,175,95,.42)',stroke:'rgba(20,105,45,.95)','stroke-width':'.04','stroke-linejoin':'round'},esc);
  for(let mm=0;mm<=Math.floor((EL-.6)*10);mm++){const x=mm/10+.3,L=mm%10===0?.42:(mm%5===0?.3:.18);
    el('line',{x1:x,y1:0,x2:x,y2:-L,stroke:'#0d4a22','stroke-width':mm%10===0?'.025':'.013'},esc);
    if(mm%10===0&&mm>0) el('text',{x:x,y:-.62,'font-size':'.3','font-weight':'700',fill:'#0d4a22','font-family':FONT,'text-anchor':'middle'},esc).textContent=mm/10;}
  el('path',{d:'M0,-.55 L.55,-.55 L.55,0',fill:'none',stroke:'#0d4a22','stroke-width':'.035'},esc);
})();
const escTexts=[...esc.querySelectorAll('text')];
const escHi=el('circle',{r:.4,fill:'none',stroke:'#B83232','stroke-width':'.07',opacity:0},G.inst);
/* ---------------- LÁPIZ ---------------- */
const pencil=el('g',{filter:'url(#sh)'},G.inst);
(function(){
  el('polygon',{points:'0,0 .55,-.16 .55,.16',fill:'url(#wood)'},pencil);
  el('polygon',{points:'0,0 .18,-.055 .18,.055',fill:'#2b2b2b'},pencil);
  el('rect',{x:.55,y:-.19,width:5.2,height:.38,fill:'url(#ybody)'},pencil);
  el('line',{x1:.55,y1:-.06,x2:5.75,y2:-.06,stroke:'rgba(0,0,0,.12)','stroke-width':'.02'},pencil);
  el('rect',{x:5.75,y:-.2,width:.45,height:.4,fill:'#b8bcc2'},pencil);
  el('rect',{x:6.2,y:-.19,width:.45,height:.38,rx:.1,fill:'#E88A9A'},pencil);
})();

/* ---------------- estado estándar de instrumentos ---------------- */
function baseState(){return{
  ruler:{op:0,O:[0,0],rot:0,flip:false,hi:0,hiX:10},
  comp:{op:0,P:[0,0],r:2,th:0,side:-1},
  pencil:{op:0,P:[0,0],rot:-35},
  prot:{op:0,O:[0,0],rot:0,center:0,base:0,sweep:0,ang:0,tick:0,left:false},
  esc:{op:0,V:[0,0],rot:0,flip:false,hi:0,hiP:[0,0]},
  rad:null
};}
function applyInstruments(S){
  const R=S.ruler;
  op(ruler,R.op);
  ruler.setAttribute('transform',`translate(${f(R.O[0])} ${f(R.O[1])}) rotate(${f(R.rot)})${R.flip?' scale(1,-1)':''}`);
  rulerTexts.forEach(tx=>{const y=tx.getAttribute('y');tx.setAttribute('transform',R.flip?`translate(0 ${2*y}) scale(1,-1)`:'');});
  op(rulerHi,R.hi); rulerHi.setAttribute('cx',R.hiX);
  const Pt=S.prot;
  op(prot,Pt.op); prot.setAttribute('transform',`translate(${f(Pt.O[0])} ${f(Pt.O[1])}) rotate(${f(Pt.rot)})`);
  op(protCenter,Pt.center); op(protBase,Pt.base);
  {const r=PR-.05; if(Pt.sweep<=0) protSweep.setAttribute('d','');
   else if(!Pt.left){const q=pol([0,0],r,-Pt.sweep); protSweep.setAttribute('d',`M0,0 L${r},0 A${r},${r} 0 0 0 ${f(q[0])},${f(q[1])} Z`);}
   else {const q=pol([0,0],r,-180+Pt.sweep); protSweep.setAttribute('d',`M0,0 L${-r},0 A${r},${r} 0 0 1 ${f(q[0])},${f(q[1])} Z`);}}
  {const a=Pt.left?-180+Pt.ang:-Pt.ang,p0=pol([0,0],.2,a),p1=pol([0,0],PR+.35,a),pn=pol([0,0],Pt.left?PR-1.2:PR-.72,a);
   protTick.setAttribute('x1',f(p0[0]));protTick.setAttribute('y1',f(p0[1]));protTick.setAttribute('x2',f(p1[0]));protTick.setAttribute('y2',f(p1[1]));
   op(protTick,Pt.tick); protNum.setAttribute('cx',f(pn[0]));protNum.setAttribute('cy',f(pn[1])); op(protNum,Pt.tick);}
  op(esc,S.esc.op); esc.setAttribute('transform',`translate(${f(S.esc.V[0])} ${f(S.esc.V[1])}) rotate(${f(S.esc.rot)})${S.esc.flip?' scale(1,-1)':''}`);
  escTexts.forEach(tx=>{const y=+tx.getAttribute('y');tx.setAttribute('transform',S.esc.flip?`translate(0 ${2*y-.22}) scale(1,-1)`:'');});
  op(escHi,S.esc.hi); escHi.setAttribute('cx',f(S.esc.hiP[0])); escHi.setAttribute('cy',f(S.esc.hiP[1]));
  op(comp,S.comp.op); if(S.comp.op>0) drawCompass(S.comp.P,S.comp.r,S.comp.th,S.comp.side);
  op(pencil,S.pencil.op); pencil.setAttribute('transform',`translate(${f(S.pencil.P[0])} ${f(S.pencil.P[1])}) rotate(${S.pencil.rot})`);
  if(S.rad&&S.rad.op>0){const Q=pol(S.rad.P,S.rad.r,S.rad.th);
    radGuide.setAttribute('x1',f(S.rad.P[0]));radGuide.setAttribute('y1',f(S.rad.P[1]));radGuide.setAttribute('x2',f(Q[0]));radGuide.setAttribute('y2',f(Q[1]));op(radGuide,S.rad.op);
    const m=L2(S.rad.P,Q,.5),n=[-Math.sin(S.rad.th*deg),Math.cos(S.rad.th*deg)],s=n[1]>0?1:-1;
    radLbl.setAttribute('x',f(m[0]+n[0]*s*.55));radLbl.setAttribute('y',f(m[1]+n[1]*s*.55+.18));radLbl.textContent=S.rad.txt;op(radLbl,S.rad.op);
  } else {op(radGuide,0);op(radLbl,0);}
}

/* =====================================================================
   CONSTRUCCIÓN 6 · RECTAS PARALELAS — regla + escuadra, separación 4 cm
   ===================================================================== */
const CFG={
  title:'Construcción 1 · Rectas paralelas · Geometría 7°',
  hdr:'Plan de recuperación — Construcción 1 de 7',
  pills:['Regla + escuadra','Paralelas'],
  stitle:'Rectas paralelas', ssub:'Nunca se cortan: siempre a la misma distancia',
  datos:[['Recta r','16','cm'],['Separación','4','cm'],['Rectas','3','']],
  mats:['📏 Regla','📐 Escuadra','✏️ Lápiz','📄 Cartulina 1/8'],
  ftr:'Geometría 7° — Rectas paralelas · Medidas reales para tu cartulina'
};
const Y0=13.2, X0=4.5, X1=20.5, VX=6, LEN=10;
const R0=[X0,Y0], R1=[X1,Y0];
const lines=[0,4,8].map(k=>({y:Y0-k}));
/* ---- objetos ---- */
const lr=sideLine(), ls=sideLine(), lt=sideLine();
[ls,lt].forEach(l=>l.setAttribute('stroke','#1A6B5A'));
lt.setAttribute('stroke','#C47C1A');
function name(txt,y,color){const t=el('text',{x:X1+.35,y:y+.25,'font-size':'.8','font-weight':'800','font-style':'italic',fill:color,'font-family':'DM Serif Display',opacity:0},G.labels);t.textContent=txt;return t;}
const nr=name('r',Y0,'#1C1C1E'), ns=name('s',Y0-4,'#1A6B5A'), nt=name('t',Y0-8,'#C47C1A');
nr.setAttribute('x',X1+.35); ns.setAttribute('x',VX+LEN+.35); nt.setAttribute('x',VX+LEN+.35);
const mk=[];[0,1].forEach(j=>{[4,8].forEach(k=>{const x=j?VX+LEN-1.2:VX+1.8, y1=Y0-k+4, y2=Y0-k;
  const g=el('g',{opacity:0},G.labels);
  el('line',{x1:x,y1:y1-.08,x2:x,y2:y2+.08,stroke:'#6C3483','stroke-width':'.045'},g);
  el('path',{d:`M${x-.18},${y1-.35} L${x},${y1-.08} L${x+.18},${y1-.35} M${x-.18},${y2+.35} L${x},${y2+.08} L${x+.18},${y2+.35}`,fill:'none',stroke:'#6C3483','stroke-width':'.045'},g);
  const t=el('text',{x:x+.3,y:(y1+y2)/2+.16,'font-size':'.46','font-weight':'800',fill:'#6C3483','font-family':FONT},g);t.textContent='4 cm';
  mk.push(g);});});
const sealG=seal('r ∥ s ∥ t','Siempre a 4 cm: nunca se cortan','#1A6B5A',16.0);
function blankExtra(){return{r:0,s:0,t:0,nr:0,ns:0,nt:0,mk:0,seal:0};}

/* escuadra: ángulo recto en (VX, y), cateto horizontal sobre la recta, cateto vertical hacia arriba */
function place(S,y,op_){S.esc.op=op_; S.esc.V=[VX,y]; S.esc.rot=0; S.esc.flip=false;}
function guide(S,op_){S.ruler.op=op_; S.ruler.O=[VX,Y0]; S.ruler.rot=-90; S.ruler.flip=true;}
function slideDraw(S,p,from,to,key,hiX){
  guide(S,1); S.ruler.hi=seg(p,.35,.42)*(1-seg(p,.9,1)); S.ruler.hiX=hiX;
  place(S,lerp(Y0-from,Y0-to,seg(p,.05,.4)),1);
  S.pencil.op=seg(p,.45,.5)*(1-seg(p,.86,.9)); S.pencil.rot=-35;
  S[key]=seg(p,.5,.86); S.pencil.P=[VX+.15+(LEN-.3)*S[key],Y0-to];
}
/* ---- guion ---- */
const STEPS=[
 {t:'Prepara tu cartulina',c:'--blue',dur:4,
  cap:'Cartulina de <b>1/8</b> en horizontal. Nombre y grupo arriba. Necesitas <b>regla, escuadra y lápiz</b>.',
  run:(S,p)=>{}},
 {t:'Traza la recta r',c:'--blue',dur:8,
  cap:'Con la regla traza una recta de <b>16 cm</b> en la parte de abajo de la cartulina. Llámala <b>r</b>.',
  run:(S,p)=>{
    S.ruler.op=seg(p,0,.15)*(1-seg(p,.88,1)); S.ruler.O=R0;
    S.pencil.op=seg(p,.15,.22)*(1-seg(p,.82,.88)); S.r=seg(p,.22,.82); S.pencil.P=L2(R0,R1,S.r);
    S.nr=seg(p,.85,.95);
  }},
 {t:'Escuadra sobre r y regla de guía',c:'--teal',dur:12,
  cap:'Apoya un <b>lado de la escuadra sobre r</b>. Pega la <b>regla</b> al otro lado de la escuadra, con el <b>0 sobre r</b>. La regla ya no se mueve.',
  run:(S,p)=>{
    place(S,Y0,seg(p,0,.2)); S.esc.V=L2([VX+3,Y0-2.5],[VX,Y0],seg(p,.1,.45));
    guide(S,seg(p,.5,.7)); S.ruler.hi=seg(p,.75,.85); S.ruler.hiX=0;
  }},
 {t:'Desliza 4 cm y traza s',c:'--teal',dur:12,
  cap:'Sujeta la regla y <b>desliza la escuadra hacia arriba</b> hasta el <b>4</b>. Traza la recta <b>s</b> por el borde de la escuadra.',
  run:(S,p)=>{ slideDraw(S,p,0,4,'s',4); S.ns=seg(p,.88,.96); }},
 {t:'Desliza hasta 8 y traza t',c:'--amber',dur:11,
  cap:'Sigue deslizando la escuadra hasta el <b>8</b> y traza la recta <b>t</b>. Todas quedan <b>paralelas</b>.',
  run:(S,p)=>{ slideDraw(S,p,4,8,'t',8); S.nt=seg(p,.88,.96); }},
 {t:'Verifica la distancia',c:'--purple',dur:11,
  cap:'Retira los instrumentos. Mide en <b>dos lugares distintos</b>: la distancia entre las rectas es siempre <b>4 cm</b>.',
  run:(S,p)=>{ guide(S,1-seg(p,0,.15)); place(S,Y0-8,1-seg(p,0,.15)); S.mk=seg(p,.2,.55); S.seal=seg(p,.65,.8); }},
 {t:'Entrega',c:'--purple',dur:6,
  cap:'Repasa las tres rectas, escribe <b>r, s y t</b> y el símbolo <b>r ∥ s ∥ t</b>, y entrega tu cartulina.',
  run:(S,p)=>{}}
];
function apply(S){
  setLine(lr,R0,R1,S.r); setLine(ls,[VX,Y0-4],[VX+LEN,Y0-4],S.s); setLine(lt,[VX,Y0-8],[VX+LEN,Y0-8],S.t);
  op(nr,S.nr); op(ns,S.ns); op(nt,S.nt); mk.forEach(g=>op(g,S.mk)); op(sealG,S.seal);
}

/* ================= ARRANQUE GENÉRICO ================= */
document.title=CFG.title;
document.getElementById('hdrTxt').textContent=CFG.hdr;
document.getElementById('pills').innerHTML=CFG.pills.map((p,i)=>`<span class="pill ${i===CFG.pills.length-1?'a':'b'}">${p}</span>`).join('');
document.getElementById('stitle').textContent=CFG.stitle;
document.getElementById('ssub').textContent=CFG.ssub;
document.getElementById('datos').innerHTML=CFG.datos.map(([k,v,u])=>`<div class="dato"><div class="k">${k}</div><div class="v">${v} <small>${u}</small></div></div>`).join('');
document.getElementById('mats').innerHTML=CFG.mats.map(m=>`<span>${m}</span>`).join('');
document.getElementById('ftrL').textContent=CFG.ftr;

let T0=0; STEPS.forEach(s=>{s.start=T0;T0+=s.dur;}); let TOTAL=T0;
let lastIdx=-1;
function setDurations(arr){T0=0;STEPS.forEach((s,i)=>{s.dur=arr[i];s.start=T0;T0+=s.dur;});TOTAL=T0;window.TOTAL=TOTAL;lastIdx=-1;return TOTAL;}
window.setDurations=setDurations;
const stepsBox=document.getElementById('steps');
STEPS.forEach((s,i)=>{const d=document.createElement('div');d.className='st';d.style.setProperty('--c',`var(${s.c})`);
  d.innerHTML=`<span class="n">${i+1}</span><span class="t">${s.t}</span>`;stepsBox.appendChild(d);s.dom=d;});
const cap=document.getElementById('cap'),capnum=document.getElementById('capnum'),captxt=document.getElementById('captxt'),prog=document.getElementById('prog');

function renderAt(t){
  t=Math.max(0,Math.min(TOTAL,t));
  const S=Object.assign(baseState(),blankExtra()); let idx=0;
  STEPS.forEach((s,i)=>{ if(t>=s.start){ idx=i; s.run(S,cl((t-s.start)/s.dur)); } });
  applyInstruments(S); apply(S);
  if(idx!==lastIdx){
    STEPS.forEach((s,i)=>{s.dom.classList.toggle('on',i===idx);s.dom.classList.toggle('done',i<idx);});
    const s=STEPS[idx]; cap.style.setProperty('--c',`var(${s.c})`);
    capnum.innerHTML=`<b>${idx+1}</b><span>DE ${STEPS.length}</span>`; captxt.innerHTML=s.cap; lastIdx=idx;
  }
  {const s=STEPS[idx],k=cl((t-s.start)/.5); captxt.style.opacity=k.toFixed(3); captxt.style.transform=`translateY(${((1-k)*8).toFixed(1)}px)`;}
  prog.style.width=(t/TOTAL*100).toFixed(2)+'%';
}
window.renderAt=renderAt; window.TOTAL=TOTAL;

const stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`;}
addEventListener('resize',fit); fit();

const QS=new URLSearchParams(location.search);
const RENDER=QS.has('render');
let t=0,target=0,auto=QS.has('video'),last=null;
if(QS.has('video')) document.body.classList.add('video');
function stepEnd(i){return STEPS[i].start+STEPS[i].dur;}
function curIdx(tt){let k=0;STEPS.forEach((s,i)=>{if(tt>=s.start-1e-6)k=i;});return k;}
function next(){ if(auto) return; const i=curIdx(t); target=(t>=stepEnd(i)-1e-3&&i+1<STEPS.length)?stepEnd(i+1):stepEnd(i); }
function prev(){ auto=false; const i=curIdx(t-1e-3); const k=Math.max(0,(t<=stepEnd(i)+1e-3?i-1:i)); t=target=stepEnd(k); renderAt(t);}
function loop(ts){ if(last==null) last=ts; const dt=Math.min(.05,(ts-last)/1000); last=ts;
  if(auto) target=TOTAL; if(t<target){ t=Math.min(target,t+dt); renderAt(t); } requestAnimationFrame(loop);}
if(!RENDER){
  document.querySelectorAll('#svg [filter]').forEach(e=>e.removeAttribute('filter'));
  [legN,legP].forEach(e=>{e.setAttribute('stroke','#4a3810');e.setAttribute('stroke-width','.035');});
  hinge.setAttribute('stroke-width','.05'); ruler.querySelector('rect').setAttribute('stroke-width','.05');
  t=target=auto?0:stepEnd(0); renderAt(t); requestAnimationFrame(loop);
  document.addEventListener('click',()=>next());
  document.addEventListener('keydown',e=>{
    if(['Space','ArrowRight','PageDown','Enter'].includes(e.code)){e.preventDefault();next();}
    else if(['ArrowLeft','PageUp'].includes(e.code)){e.preventDefault();prev();}
    else if(e.code==='KeyA'){auto=!auto; if(!auto) target=t;}
    else if(e.code==='Home'){auto=false;t=target=0;renderAt(0);}
    else if(e.code==='KeyF'){ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen(); }
  });
} else { document.body.classList.add('render'); renderAt(0); }

</script>
